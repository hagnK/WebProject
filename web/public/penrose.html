<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>펜로즈 삼각형 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #07071a; }

    #ui {
      position: absolute;
      top: 24px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    h1 {
      color: #fff;
      font-size: 1.6rem;
      letter-spacing: 4px;
      font-weight: 300;
      text-shadow: 0 0 40px rgba(255,190,60,.75);
    }
    #hint {
      color: rgba(255,255,255,.45);
      font-size: .8rem;
      letter-spacing: 1px;
    }

    #btns {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
    }
    button {
      padding: 10px 22px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.18);
      color: rgba(255,255,255,.82);
      border-radius: 7px;
      cursor: pointer;
      font-size: .85rem;
      font-family: inherit;
      letter-spacing: .5px;
      transition: background .15s;
      white-space: nowrap;
    }
    button:hover { background: rgba(255,255,255,.14); }
    button.active { border-color: rgba(255,190,60,.6); color: #ffc04d; }

    #corner-label {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,.28);
      font-family: monospace;
      font-size: .72rem;
      letter-spacing: 1px;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>
<body>

<div id="ui">
  <h1>펜로즈 삼각형</h1>
  <p id="hint">드래그 회전 &nbsp;·&nbsp; 스크롤 줌 &nbsp;·&nbsp; 마법 시점에서 착시 확인!</p>
</div>

<div id="btns">
  <button id="btnMagic">✨ 마법 시점</button>
  <button id="btnSpin" class="active">⟳ 자동 회전 ON</button>
</div>

<div id="corner-label">
  불가능한 삼각형 — Penrose Triangle 3D
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Renderer ────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ─── Scene ───────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07071a);
scene.fog = new THREE.FogExp2(0x07071a, 0.032);

// ─── Camera ───────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);

// Penrose triangle: 3 orthogonal beams forming the impossible chain
// Beam 1: X-axis (0,0,0)→(L,0,0)
// Beam 2: Y-axis (L,0,0)→(L,L,0)
// Beam 3: Z-axis (L,L,0)→(L,L,L)
// Key: (0,0,0) and (L,L,L) project to identical screen pos from (1,1,1) direction
//      → the "gap" hides along the viewing ray → impossible triangle illusion ✓

const L = 3;
const t = 0.52;

// Visual centroid of the triangle from (1,1,1) view
// = average of beam midpoints: (L/2,0,0) + (L,L/2,0) + (L,L,L/2) / 3
const CENTER = new THREE.Vector3(
  (L / 2 + L + L) / 3,        // = 2.5
  (0 + L / 2 + L) / 3,        // = 1.5
  (0 + 0 + L / 2) / 3         // = 0.5
);

// Magic camera: along (1,1,1)/√3 from center
const D = 12;
const INV_S3 = 1 / Math.sqrt(3);
const MAGIC_POS = CENTER.clone().addScaledVector(
  new THREE.Vector3(INV_S3, INV_S3, INV_S3), D
);

camera.position.copy(MAGIC_POS);

// ─── Controls ─────────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(CENTER);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 4;
controls.maxDistance = 30;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.8;
controls.update();

// ─── Lights ───────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.22));

const sun = new THREE.DirectionalLight(0xfff5cc, 1.15);
sun.position.set(12, 18, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 50;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x4060cc, 0.4);
fill.position.set(-10, -6, -10);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xff7733, 0.3);
rim.position.set(6, -12, 18);
scene.add(rim);

// ─── Penrose Triangle Geometry ────────────────────────────────────────────────
// Each beam: L+t size so the boxes overlap at corners for clean joints
// Overlap at "real" corners (3,0,0) and (3,3,0) looks correct
// Overlap at "illusion" corner (0,0,0)↔(3,3,3) is hidden along viewing ray

const mats = [
  new THREE.MeshStandardMaterial({ color: 0xd64000, roughness: 0.3, metalness: 0.55 }), // red-orange
  new THREE.MeshStandardMaterial({ color: 0xc89000, roughness: 0.3, metalness: 0.55 }), // gold
  new THREE.MeshStandardMaterial({ color: 0x2860cc, roughness: 0.3, metalness: 0.55 }), // blue
];

function addBox(wx, wy, wz, cx, cy, cz, mat) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(wx, wy, wz), mat);
  mesh.position.set(cx, cy, cz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

// Beam 1: along X — center (L/2, 0, 0)
addBox(L + t, t, t,  L / 2, 0, 0,       mats[0]);
// Beam 2: along Y — center (L, L/2, 0)
addBox(t, L + t, t,  L,     L / 2, 0,   mats[1]);
// Beam 3: along Z — center (L, L, L/2)
addBox(t, t, L + t,  L,     L,    L / 2, mats[2]);

// Subtle floor grid for depth reference
const grid = new THREE.GridHelper(20, 20, 0x223366, 0x223366);
grid.position.set(CENTER.x, -1.5, CENTER.z);
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

// ─── Camera animation ─────────────────────────────────────────────────────────
let anim = null;

function flyTo(targetPos, targetLook, duration = 1100) {
  const startPos = camera.position.clone();
  const startLook = controls.target.clone();
  const startTime = performance.now();

  anim = { startPos, startLook, targetPos, targetLook, duration, startTime };
}

function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
}

// ─── Buttons ──────────────────────────────────────────────────────────────────
document.getElementById('btnMagic').addEventListener('click', () => {
  controls.autoRotate = false;
  document.getElementById('btnSpin').classList.remove('active');
  document.getElementById('btnSpin').textContent = '⟳ 자동 회전 OFF';
  flyTo(MAGIC_POS, CENTER);
});

let spinning = true;
document.getElementById('btnSpin').addEventListener('click', () => {
  spinning = !spinning;
  controls.autoRotate = spinning;
  const btn = document.getElementById('btnSpin');
  btn.classList.toggle('active', spinning);
  btn.textContent = spinning ? '⟳ 자동 회전 ON' : '⟳ 자동 회전 OFF';
});

// ─── Render loop ──────────────────────────────────────────────────────────────
function animate(now) {
  requestAnimationFrame(animate);

  if (anim) {
    const elapsed = now - anim.startTime;
    const progress = Math.min(elapsed / anim.duration, 1);
    const e = easeInOut(progress);

    camera.position.lerpVectors(anim.startPos, anim.targetPos, e);
    controls.target.lerpVectors(anim.startLook, anim.targetLook, e);

    if (progress >= 1) anim = null;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate(0);

// ─── Resize ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
